name: One-time finance model cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor == 'GerbenKG'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor and inspect legacy fields
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('app.js')
          s=path.read_text()
          s=s.replace('let financeData={seasons:[],tickets:[],expenses:[]}, financeLoaded=false, financeLoading=false, financeSeasonId=null;', 'let financeData={seasons:[],tickets:[],expenses:[]}, financeLoaded=false, financeLoading=false, financeSeasonId=null;\nlet playerFinanceData={seasons:[],tickets:[]};')
          s=s.replace('const badge=(t,c="slate")=>\'<span class="badge badge-\'+c+\'">\'+t+"</span>";', 'const badge=(t,c="slate")=>\'<span class="badge badge-\'+c+\'">\'+t+"</span>";\nconst ticketForPlayer=(playerId,date)=>{const season=playerFinanceData.seasons.find(s=>date>=s.starts_on&&date<=s.ends_on);return season?playerFinanceData.tickets.find(t=>t.season_id===season.id&&t.player_id===playerId):null;};\nconst isSeasonTicket=(playerId,date)=>!!ticketForPlayer(playerId,date);')
          s=s.replace('if(state.players.length)await check(await sb.from("players").upsert(state.players.map(p=>({id:p.id,name:p.name,model:p.model,season_paid:!!p.seasonPaid}))),"Saving players");','if(state.players.length)await check(await sb.from("players").upsert(state.players.map(p=>({id:p.id,name:p.name,phone:p.phone||null,email:p.email||null}))),"Saving players");')
          old=''' const p=await sb.from("players").select("*").order("name");\n const g=await sb.from("games").select("*").order("game_date");\n const r=await sb.from("game_players").select("*");\n if(p.error||g.error||r.error)throw(p.error||g.error||r.error);\n state.players=(p.data||[]).map(x=>({id:x.id,name:x.name,model:x.model,seasonPaid:x.season_paid}));'''
          new=''' const p=await sb.from("players").select("id,name,phone,email").order("name");\n const g=await sb.from("games").select("*").order("game_date");\n const r=await sb.from("game_players").select("*");\n const fs=await sb.from("finance_seasons").select("id,starts_on,ends_on");\n const ft=await sb.from("finance_season_tickets").select("id,season_id,player_id,amount,paid,paid_on");\n if(p.error||g.error||r.error||fs.error||ft.error)throw(p.error||g.error||r.error||fs.error||ft.error);\n playerFinanceData={seasons:fs.data||[],tickets:ft.data||[]};\n state.players=(p.data||[]).map(x=>({id:x.id,name:x.name,phone:x.phone||"",email:x.email||""}));'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('const season=state.players.filter(p=>p.model==="season"),pay=state.players.filter(p=>p.model==="game");','const season=state.players.filter(p=>isSeasonTicket(p.id,g.date)),pay=state.players.filter(p=>!isSeasonTicket(p.id,g.date));')
          s=s.replace('const due=rows.filter(x=>x.attended&&!x.guest&&player(x.playerId)?.model==="game"&&!x.paid).length;','const due=rows.filter(x=>{if(x.guest)return !x.paid;const t=ticketForPlayer(x.playerId,g.date);return t?!t.paid:!x.paid;}).length;')
          s=s.replace('season.filter(p=>p.seasonPaid).length/season.length','season.filter(p=>ticketForPlayer(p.id,g.date)?.paid).length/season.length')
          s=s.replace('((p.model==="season")?"🎟 Season ticket":"Per game")','(isSeasonTicket(p.id,g.date)?"🎟 Season ticket":"Per game")')
          s=s.replace('p?.model==="season"?"🎟 Season":"Per game"','isSeasonTicket(p.id,g.date)?"🎟 Season":"Per game"')
          s=s.replace('(p?.model==="season"?(p.seasonPaid?"Season paid":"Season unpaid"):(x.paid?"Paid":"Mark paid"))','(ticketForPlayer(p.id,g.date)?(ticketForPlayer(p.id,g.date).paid?"Season paid":"Season unpaid"):(x.paid?"Paid":"Mark paid"))')
          s=s.replace('x.guest||p?.model==="season"?(x.paid||p?.seasonPaid?"green":"amber"):(x.paid?"green":"red")','x.guest||isSeasonTicket(p.id,g.date)?((ticketForPlayer(p.id,g.date)?.paid)||x.paid?"green":"amber"):(x.paid?"green":"red")')
          s=s.replace('(!x.guest&&p?.model==="game" || x.guest)','(!x.guest&&!isSeasonTicket(p.id,g.date) || x.guest)')
          s=s.replace('const seasonPlayers=state.players.filter(p=>p.model==="season");','const seasonPlayers=tickets.map(t=>player(t.player_id)).filter(Boolean);')
          s=s.replace('const ppPlayers=state.players.filter(p=>p.model==="game");','const ppPlayers=state.players.filter(p=>!tickets.some(t=>t.player_id===p.id));')
          s=s.replace('p.name=f.get("name").trim();p.model=f.get("model");p.seasonPaid=f.has("seasonPaid");','p.name=f.get("name").trim();p.phone=f.get("phone")?.trim()||"";p.email=f.get("email")?.trim()||"";')
          path.write_text(s)
          print('--- app.js remaining legacy references ---')
          for i,line in enumerate(s.splitlines(),1):
            if any(x in line for x in ('seasonPaid','season_paid','p.model','x.model')): print(i,line)
          print('--- other JS legacy references ---')
          for f in Path('.').glob('*.js'):
            for i,line in enumerate(f.read_text(errors='ignore').splitlines(),1):
              if any(x in line for x in ('seasonPaid','season_paid','p.model','x.model')): print(f'{f}:{i}:{line}')
          # keep workflow alive for inspection
          path.write_text(s)
      - name: Commit inspected refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Refactor player finance data sources" || exit 0
          git push
