name: One-time finance model cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor == 'GerbenKG'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining legacy player finance code
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('app.js'); s=p.read_text()
          # Remove season-payment writes from the generic payments table.
          start=s.find('  state.players.filter(p=>p.model==="season"&&p.seasonPaid).forEach')
          if start >= 0:
              end=s.find('\n  state.games.forEach', start)
              if end > start: s=s[:start]+s[end+1:]
          s=s.replace('season.filter(p=>p.seasonPaid).length/season.length','season.filter(p=>ticketForPlayer(p.id,g.date)?.paid).length/season.length')
          s=s.replace('player(p.playerId)?.model==="game"&&p.paid','!isSeasonTicket(p.playerId,g.date)&&p.paid')
          s=s.replace('player(p.playerId)?.model==="game")','!isSeasonTicket(p.playerId,g.date))')
          s=s.replace('<p class="muted">Payment model and season-ticket status.</p>','<p class="muted">Roster and contact information.</p>')
          s=s.replace('<th>Player</th><th>Payment model</th><th>Season ticket</th><th></th>','<th>Player</th><th>Phone</th><th>Email</th><th></th>')
          old="""     badge(p.model===\"season\"?\"🎟 Season ticket\":\"Per game\",p.model===\"season\"?\"green\":\"slate\")+'</td><td>'+\n     (p.model===\"season\"?(p.seasonPaid?badge(\"✓ Paid\",\"green\"):badge(\"Unpaid\",\"red\")):\"—\")+\n     '</td><td><div class=\"actions\">'+actions+'</div></td></tr>';"""
          new="""     esc(p.phone||\"—\")+'</td><td>'+esc(p.email||\"—\")+\n     '</td><td><div class=\"actions\">'+actions+'</div></td></tr>';"""
          if old in s: s=s.replace(old,new)
          old_start=s.find(' if(a==="new-player"||a==="edit")')
          old_end=s.find('\n if(a==="history")',old_start) if old_start>=0 else -1
          if old_start>=0 and old_end>old_start:
              form=''' if(a==="new-player"||a==="edit"){const p=a==="edit"?player(id):null;return modal(p?"Edit player":"Add player",'<form id="player-form" data-id="'+(p?.id||"")+'"><label>Name<input name="name" value="'+esc(p?.name||"")+'" required></label><label>Phone<input name="phone" type="tel" value="'+esc(p?.phone||"")+'"></label><label>Email<input name="email" type="email" value="'+esc(p?.email||"")+'"></label><div class="modal-actions"><button type="button" class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary">Save player</button></div></form>');}'''
              s=s[:old_start]+form+s[old_end:]
          s=s.replace('p.name=f.get("name").trim();p.model=f.get("model");p.seasonPaid=f.has("seasonPaid");','p.name=f.get("name").trim();p.phone=f.get("phone")?.trim()||"";p.email=f.get("email")?.trim()||"";')
          s=s.replace('Player found:", p ? { id:p.id, name:p.name, model:p.model } : null','Player found:", p ? { id:p.id, name:p.name } : null')
          p.write_text(s)

          p=Path('ui-fixes.js'); t=p.read_text()
          t=t.replace('sb.from("players").select("id,name,model")','sb.from("players").select("id,name")')
          t=t.replace('return !!row.guest_name || playerById.get(row.player_id)?.model === "game";','return !!row.guest_name || !seasonTickets.some(t => t.player_id === row.player_id);')
          t=t.replace('x.guest_name || playersById.get(x.player_id)?.model === "game"','x.guest_name || !tickets.some(t => t.player_id === x.player_id)')
          t=t.replace('data.players.filter(p => p.model === "game")','data.players.filter(p => !tickets.some(t => t.player_id === p.id))')
          t=re.sub(r'\n  function removeLegacySeasonPaidField\(\) \{.*?\n  \}\n\n','\n',t,flags=re.S)
          t=re.sub(r'\n  function removeLegacySeasonPaidColumn\(\) \{.*?\n  \}\n\n','\n',t,flags=re.S)
          t=t.replace('    removeLegacySeasonPaidField();\n','').replace('    removeLegacySeasonPaidColumn();\n','')
          p.write_text(t)

          p=Path('players-ui-fix.js'); t=p.read_text()
          t=re.sub(r'\n  // Payment model and season-paid status.*?\n  }\n\n','\n',t,flags=re.S)
          t=re.sub(r'\n  document\.addEventListener\("submit", event => \{.*?\n  \}, true\);\n\n','\n',t,flags=re.S)
          t=t.replace('    removeLegacyFinanceFields();\n','')
          p.write_text(t)

          p=Path('dashboard-stats-final.js'); t=p.read_text()
          t=t.replace('sb.from("players").select("id,name,model")','sb.from("players").select("id,name")')
          t=t.replace('if(p?.model==="season")return ticketByPlayer.get(gp.player_id)!==true;','if(ticketByPlayer.has(gp.player_id))return ticketByPlayer.get(gp.player_id)!==true;')
          t=re.sub(r'\n      const p=playerById\.get\(gp\.player_id\);\n      if\(p\?\.model!=="season"\)return;','\n      if(!ticketByPlayer.has(gp.player_id))return;',t)
          p.write_text(t)

          Path('supabase-config.js').write_text('''window.supabaseClient = null;\ntry {\n  if (!window.supabase || !window.supabase.createClient) throw new Error("Supabase library did not load.");\n  window.supabaseClient = window.supabase.createClient("https://fumawncedxswwvafecuj.supabase.co","sb_publishable_5ELVcnDfatNVXqHNM7WKjQ_wJ9qC8F4");\n} catch (e) {\n  window.supabaseInitError = e;\n}\n''')

          print('remaining legacy references:')
          for f in Path('.').glob('*.js'):
              for i,line in enumerate(f.read_text(errors='ignore').splitlines(),1):
                  if any(x in line for x in ('seasonPaid','season_paid','p.model','x.model')): print(f'{f}:{i}:{line}')

      - name: Commit cleanup and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js ui-fixes.js players-ui-fix.js dashboard-stats-final.js supabase-config.js
          git commit -m "Remove legacy player finance model"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git rm .github/workflows/one-time-finance-model-cleanup.yml
          git commit -m "Remove one-time cleanup workflow"
          git push origin HEAD:main
