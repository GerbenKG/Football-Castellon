name: Restore app after cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor == 'GerbenKG'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore app.js from verified cleanup commit
        run: |
          git fetch origin faabe3a0723ccd4956dcf876a0b79673e15272d1:refs/remotes/origin/restore-app
          git checkout refs/remotes/origin/restore-app -- app.js
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          s=s.replace('season.filter(p=>p.seasonPaid).length/season.length','season.filter(p=>ticketForPlayer(p.id,g.date)?.paid).length/season.length')
          p.write_text(s)
          PY
      - name: Commit restored app and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Restore app after finance cleanup"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git rm .github/workflows/restore-app.yml
          git commit -m "Remove restore workflow"
          git push origin HEAD:main
