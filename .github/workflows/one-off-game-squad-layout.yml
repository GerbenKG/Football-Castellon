name: Apply Game Squad layout

on:
  push:
    branches: [fix/game-squad-columns]

permissions:
  contents: write

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout
        run: |
          cat >> bibs.css <<'EOF'

          /* Keep payment status and bib tracking in stable columns for every squad row. */
          .squad-row{display:grid;grid-template-columns:minmax(0,1fr) 220px 220px 40px;align-items:center;column-gap:12px}
          .squad-row>.who{grid-column:1}
          .squad-row>.toggle.payment-toggle,.squad-row>.badge{grid-column:2;justify-self:start;margin-left:0}
          .squad-row>.bib-toggle{grid-column:3;justify-self:start;margin-left:0}
          .squad-row>.remove{grid-column:4;justify-self:end}
          EOF
          rm -f .github/workflows/one-off-game-squad-layout.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibs.css .github/workflows/one-off-game-squad-layout.yml
          git commit -m "Align Game squad payment and bib columns"
          git push
