g("en-GB",{weekday:"long",day:"numeric",month:"long"});async function permission(){if(allowed!==null)return allowed;try{const{data,error}=await sb.rpc("get_my_access");if(error)throw error;allowed=data?.allowed===true&&data?.permissions?.["payments.manage"]===true}catch{allowed=false}return allowed}async function markPaid(row,input){if(busy)return;const cells=row.querySelectorAll("td");if(cells.length<2)return;busy=true;input.disabled=true;try{const name=cells[0].textContent.trim(),kind=cells[1].textContent.trim();if(kind==="Season ticket"){const seasonId=document.getElementById("finance-season-select")?.value;if(!seasonId)throw Error("No finance season is selected.");const p=await sb.from("players").select("id").eq("name",name).limit(1).single();if(p.error)throw p.error;const t=await sb.from("finance_season_tickets").select("id").eq("season_id",seasonId).eq("player_id",p.data.id).limit(1).single();if(t.error)throw t.error;const r=await sb.from("finance_season_tickets").update({paid:true,paid_on:new Date().toISOString().slice(0,10)}).eq("id",t.data.id);if(r.error)throw r.error}else{const g=await sb.from("games").select("id,game_date").order("game_date");if(g.error)throw g.error;const target=(g.data||[]).find(x=>dateText(x.game_date)===kind);if(!target)throw Error("Game could not be found.");const r=await sb.from("game_players").select("id,guest_name,players(name)").eq("game_id",target.id);if(r.error)throw r.error;const gp=(r.data||[]).find(x=>x.guest_name===name||x.players?.name===name);if(!gp)throw Error("Payment record could not be found.");const u=await sb.from("game_players").update({paid:true}).eq("id",gp.id);if(u.error)throw u.error}row.remove()}catch(e){input.checked=false;input.disabled=false;alert("Could not mark payment as paid: "+(e.message||"Unknown error"))}finally{busy=false}}async function enhance(){if(!document.querySelector('.nav-item[data-view="finance"].active'))return;if(!(await permission()))return;const h=[...document.querySelectorAll("h3")].find(x=>x.textContent.trim()==="Who still needs to pay?");const table=h?.closest(".card")?.querySelector("table");if(!table)return;const head=table.tHead?.rows?.[0];if(head&&!([...head.cells].some(x=>x.textContent.trim()==="Paid"))){const th=document.createElement("th");th.textContent="Paid";head.appendChild(th)}table.tBodies?.[0]?.querySelectorAll("tr").forEach(row=>{if(row.querySelector("input[data-finance-paid]"))return;const td=document.createElement("td"),input=document.createElement("input");input.type="checkbox";input.dataset.financePaid="true";input.setAttribute("aria-label","Mark payment as paid");input.style.width="18px";input.style.height="18px";input.style.cursor="pointer";input.addEventListener("change",()=>{if(input.checked)markPaid(row,input)});td.appendChild(input);row.appendChild(td)})}let timer;const schedule=()=>{clearTimeout(timer);timer=setTimeout(()=>enhance().catch(()=>{}),80)};new MutationObserver(schedule).observe(app,{childList:true,subtree:true});sb.auth?.onAuthStateChange?.(()=>{allowed=null;schedule()});schedule()})()</script></body></html>
